# Proposed local-source recipe. Publishing requires a new release URL and SHA256.
{% set name = "SeqSero2" %}
{% set version = "1.4.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  path: ..

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vvv --no-deps --no-build-isolation --no-cache-dir
  run_exports:
    - {{ pin_subpackage(name|lower, max_pin="x") }}

requirements:
  host:
    - python >=3.8
    - pip
    - setuptools
  run:
    - python >=3.8
    - blast >=2.2.28
    - biopython >=1.75
    - samtools >=1.8
    - sra-tools >=2.8.0
    - spades >=3.15.5
    - salmid =0.1.23
    - bwa >=0.7.12
    - seqtk >=1.3

test:
  commands:
    - SeqSero2_package.py -h
    - blastn -help
    - SalmID.py -h

about:
  home: "https://github.com/denglab/{{ name }}"
  license: "GPL-2.0-or-later"
  license_family: GPL
  license_file: LICENSE
  summary: "Salmonella serotype prediction from genome sequencing data."
  dev_url: "https://github.com/denglab/{{ name }}"

extra:
  recipe-maintainers:
    - LSTUGA
  identifiers:
    - doi:10.1128/AEM.01746-19
